name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run tests
        run: make test
      - name: Stamp version from tag
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Resources/Info.plist
      - name: Assemble app bundle
        run: make app
      - name: Zip app bundle
        run: ditto -c -k --keepParent dist/Konnyaku.app "dist/Konnyaku-${GITHUB_REF_NAME}.zip"
      - name: Write release notes header
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          Homebrew でインストールできます: `brew install --cask kanka-jp/tap/konnyaku`

          ad-hoc 署名のため、初回起動はシステム設定 → プライバシーとセキュリティ → 「このまま開く」での許可 (または `xattr -dr com.apple.quarantine Konnyaku.app`) が必要です。
          EOF
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/Konnyaku-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file /tmp/release-notes.md
      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_GITHUB_TOKEN が未設定のため Homebrew cask の更新を skip"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(shasum -a 256 "dist/Konnyaku-${GITHUB_REF_NAME}.zip" | awk '{print $1}')
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/kanka-jp/homebrew-tap.git" "$RUNNER_TEMP/homebrew-tap"
          cd "$RUNNER_TEMP/homebrew-tap"
          sed -i '' -E "s|^  version \".*\"$|  version \"${VERSION}\"|" Casks/konnyaku.rb
          sed -i '' -E "s|^  sha256 \".*\"$|  sha256 \"${SHA256}\"|" Casks/konnyaku.rb
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -am "konnyaku ${VERSION}"
          git push
